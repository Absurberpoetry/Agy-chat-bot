[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-bot"
version = "0.1.0"
description = "Multi-platform forward-WebSocket QQ/chat bot powered by official Google Antigravity CLI (stream-json)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
